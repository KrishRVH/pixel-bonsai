min_version = "2026.9.16"

[settings]
lockfile = true

[tools]
gitleaks = "8.30.1"
syft = "1.55.0"

[tasks.secrets]
description = "Scan the working tree for secrets"
run = "gitleaks dir . --redact --no-banner"

[tasks.sbom]
description = "Generate a CycloneDX JSON SBOM for the project filesystem"
run = """
set -eu
source_name="${SYFT_SOURCE_NAME:-$(basename "$PWD")}"
source_version="${SYFT_SOURCE_VERSION:-0.0.0}"
export SYFT_CHECK_FOR_APP_UPDATE="${SYFT_CHECK_FOR_APP_UPDATE:-false}"
rm -rf sbom
mkdir -p sbom
syft scan dir:. --source-name "$source_name" --source-version "$source_version" --exclude ./sbom --exclude ./.git --output cyclonedx-json=sbom/sbom.cdx.json
"""

[tasks.fmt]
description = "Format the project"
depends = ["go:fmt"]

[tasks."fmt:check"]
description = "Check formatting"
depends = ["go:fmt:check"]

[tasks."docs:images"]
description = "Draw the README's pictures"
run = """
set -eu
mkdir -p docs/images
for variety in sakura maple black-pine; do
  go run . render --variety "$variety" --growth 0.85 --scale 2.5 --zoom 2 --format png >"docs/images/$variety.png"
done
for stage in seedling:0.04 first-branches:0.2 shaped:0.4 established:0.65 venerable:1; do
  go run . render --variety sakura --growth "${stage#*:}" --scale 1.5 --zoom 2 --format png >"docs/images/${stage%%:*}.png"
done
"""

[tasks.sheets]
description = "Write contact sheets of every stage to artifacts/sheets"
usage = 'arg "[variety]" help="One variety; every variety when left out"'
run = 'go run . sheet artifacts/sheets ${usage_variety:-}'

[tasks."go:vet:cross"]
description = "Vet the Windows and macOS builds"
run = ["GOOS=windows go vet ./...", "GOOS=darwin go vet ./..."]

[tasks.lint]
description = "Run static analysis and dependency checks"
depends = ["go:lint", "go:vet:cross"]

[tasks.test]
description = "Run the tests"
depends = ["go:test"]

[tasks.standards]
description = "Run the standards workflow with autofixes"
depends = ["go:standards"]

[tasks."standards:check"]
description = "Run the standards gate"
depends = ["secrets", "hygiene", "go:standards:check", "go:vet:cross"]
